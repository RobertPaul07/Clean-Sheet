# Ad ogni push esegue i test su Windows e crea CleanSheet.exe (scaricabile dalla tab Actions).
# Quando pubblichi un tag tipo v0.1.0, l'exe viene allegato a una Release su GitHub.
name: Test e build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # serve per creare la Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Crea l'eseguibile
        run: pyinstaller --onefile --windowed --name CleanSheet main.py

      - uses: actions/upload-artifact@v4
        with:
          name: CleanSheet-windows
          path: dist/CleanSheet.exe

      - name: Pubblica la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CleanSheet.exe
